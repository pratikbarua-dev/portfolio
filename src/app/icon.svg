<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logo-orange" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3300" />
      <stop offset="100%" stop-color="#FF7700" />
    </linearGradient>

    <linearGradient id="logo-amber" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5500" />
      <stop offset="100%" stop-color="#FFCC00" />
    </linearGradient>

    <linearGradient id="logo-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5500" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FF8800" stop-opacity="0.2" />
    </linearGradient>

    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <circle cx="50" cy="50" r="30" fill="url(#logo-glow)" filter="blur(8px)" opacity="0.35" />

  <path
    d="M 38 8 L 48 0 L 58 8"
    stroke="url(#logo-amber)"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#neon-glow)"
  />

  <path
    d="M 25 90 C 25 72, 30 62, 45 62 C 60 62, 72 52, 72 38 C 72 24, 58 14, 44 14 C 30 14, 24 24, 24 34"
    stroke="url(#logo-orange)"
    stroke-width="8"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#neon-glow)"
  />

  <path
    d="M 24 72 C 34 60, 44 50, 54 56 C 64 62, 72 46, 86 28"
    stroke="url(#logo-amber)"
    stroke-width="7"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#neon-glow)"
  />

  <path
    d="M 74 28 H 86 V 40"
    stroke="url(#logo-amber)"
    stroke-width="7"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#neon-glow)"
  />
</svg>
